<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relatório Técnico - Balanças</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1c1e21; --muted:#6b7280; --border:#dfe3e8;
  --accent:#2563eb; --accent-ink:#ffffff; --danger:#dc2626; --ok:#16a34a;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171b; --card:#1e2126; --text:#eceef0; --muted:#9aa1ab; --border:#2b2f36;
    --accent:#3b82f6; --accent-ink:#0b1220;
  }
}
:root[data-theme="dark"]{
  --bg:#15171b; --card:#1e2126; --text:#eceef0; --muted:#9aa1ab; --border:#2b2f36;
  --accent:#3b82f6; --accent-ink:#0b1220;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--card);border-bottom:1px solid var(--border);z-index:5}
.headtop{padding:14px 16px 0;font-weight:700;font-size:1.1rem}
nav{display:flex;gap:4px;padding:10px 12px}
nav button{flex:1;padding:10px;border:none;background:transparent;color:var(--muted);font-weight:600;border-radius:8px;cursor:pointer}
nav button.active{background:var(--accent);color:var(--accent-ink)}
main{max-width:760px;margin:0 auto;padding:16px;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
fieldset{border:1px solid var(--border);border-radius:10px;margin-bottom:14px;padding:12px 14px 16px;background:var(--card)}
legend{padding:0 6px;font-weight:700;font-size:.92rem;color:var(--accent)}
label{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 3px}
input,textarea,select{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.95rem;font-family:inherit}
textarea{resize:vertical;min-height:70px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin-top:6px;overflow-x:auto;display:block}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--border);font-size:.88rem}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border:none;font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:5px 9px;font-size:.8rem}
.sigwrap{border:1px dashed var(--border);border-radius:8px;padding:6px;background:var(--bg)}
canvas{width:100%;height:140px;background:var(--card);border-radius:6px;touch-action:none;display:block}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.hist-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
.hist-item h4{margin:0 0 4px}
.hist-item p{margin:2px 0;font-size:.85rem;color:var(--muted)}
.hist-actions{display:flex;gap:8px;margin-top:8px}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:.9rem}
.msg.ok{background:#dcfce7;color:#166534}
.msg.err{background:#fee2e2;color:#991b1b}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1}
</style>
</head>
<body>
<header>
  <div class="headtop">⚖️ Relatório Técnico de Campo</div>
  <nav>
    <button id="tabbtn-novo" class="active" onclick="showTab('novo')">Novo Relatório</button>
    <button id="tabbtn-hist" onclick="showTab('hist')">Histórico</button>
  </nav>
</header>
<main>
  <div id="msgbox"></div>

  <section id="tab-novo">
    <form id="form">
      <fieldset>
        <legend>Dados do Cliente</legend>
        <label>Nome / Razão Social *</label><input required id="clientName">
        <div class="row">
          <div><label>CPF / CNPJ</label><input id="clientDoc"></div>
          <div><label>Telefone / Contato</label><input id="clientContact"></div>
        </div>
        <label>Endereço</label><input id="clientAddress">
      </fieldset>

      <fieldset>
        <legend>Equipamento — Balança</legend>
        <div class="row">
          <div><label>Marca</label><input id="eqBrand"></div>
          <div><label>Modelo</label><input id="eqModel"></div>
        </div>
        <div class="row">
          <div><label>Capacidade</label><input id="eqCapacity" placeholder="ex: 300 kg"></div>
          <div><label>Divisão</label><input id="eqDivision" placeholder="ex: 50 g"></div>
        </div>
        <div class="row">
          <div><label>Portaria do INMETRO</label><input id="eqInmetro"></div>
          <div><label>Selo de Reparado (nº, se houver)</label><input id="eqSeal"></div>
        </div>
        <div class="row">
          <div><label>Ano de Fabricação</label><input id="eqYear" inputmode="numeric"></div>
          <div><label>Número de Série *</label><input required id="eqSerial"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Serviços Realizados</legend>
        <textarea id="services" placeholder="Descreva os serviços executados"></textarea>
      </fieldset>

      <fieldset>
        <legend>Peças Utilizadas</legend>
        <table id="partsTable"><thead><tr><th>Peça</th><th>Qtd.</th><th></th></tr></thead><tbody></tbody></table>
        <div class="addrow">
          <input id="partName" placeholder="Nome da peça">
          <input id="partQty" placeholder="Qtd" style="max-width:80px" inputmode="numeric">
          <button type="button" class="btn" onclick="addPart()">+ Adicionar</button>
        </div>
      </fieldset>

      <fieldset>
        <legend>Observações</legend>
        <textarea id="obs" placeholder="Observações gerais sobre o atendimento"></textarea>
      </fieldset>

      <fieldset>
        <legend>Técnico e Data</legend>
        <div class="row">
          <div><label>Técnico Responsável *</label><input required id="techName"></div>
          <div><label>Data do Serviço *</label><input required type="date" id="svcDate"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Assinatura do Técnico</legend>
        <div class="sigwrap"><canvas id="sigTech"></canvas></div>
        <div class="actions"><button type="button" class="btn small" onclick="clearSig('sigTech')">Limpar</button></div>
      </fieldset>

      <fieldset>
        <legend>Assinatura do Cliente</legend>
        <div class="sigwrap"><canvas id="sigClient"></canvas></div>
        <div class="actions"><button type="button" class="btn small" onclick="clearSig('sigClient')">Limpar</button></div>
      </fieldset>

      <div class="actions">
        <button type="submit" class="btn primary">Salvar e Gerar PDF</button>
        <button type="button" class="btn" onclick="resetForm()">Limpar formulário</button>
      </div>
    </form>
  </section>

  <section id="tab-hist" hidden>
    <div id="histList"><p style="color:var(--muted)">Carregando…</p></div>
  </section>
</main>

<script>
let db=null, downloads=null;
let parts=[];
const sigState={sigTech:false, sigClient:false};

(async()=>{
  try{db=await claude.use("db");}catch(e){}
  try{downloads=await claude.use("downloads");}catch(e){}
  document.getElementById('svcDate').value=new Date().toISOString().slice(0,10);
  initSig('sigTech'); initSig('sigClient');
  loadHistory();
})();

function showTab(t){
  document.getElementById('tab-novo').hidden = t!=='novo';
  document.getElementById('tab-hist').hidden = t!=='hist';
  document.getElementById('tabbtn-novo').classList.toggle('active', t==='novo');
  document.getElementById('tabbtn-hist').classList.toggle('active', t==='hist');
  if(t==='hist') loadHistory();
}

function msg(text, ok){
  document.getElementById('msgbox').innerHTML =
    '<div class="msg '+(ok?'ok':'err')+'">'+text+'</div>';
  setTimeout(()=>{document.getElementById('msgbox').innerHTML='';},4000);
}

// ---- Signature pads ----
function initSig(id){
  const c=document.getElementById(id);
  function fit(){
    const r=c.getBoundingClientRect();
    const dpr=window.devicePixelRatio||1;
    c.width=r.width*dpr; c.height=r.height*dpr;
    c.getContext('2d').scale(dpr,dpr);
  }
  fit(); window.addEventListener('resize',fit);
  const ctx=c.getContext('2d');
  ctx.lineWidth=2; ctx.lineCap='round'; ctx.strokeStyle = getComputedStyle(document.body).color;
  let drawing=false, last=null;
  function pos(e){
    const r=c.getBoundingClientRect();
    const p = e.touches? e.touches[0]:e;
    return {x:p.clientX-r.left, y:p.clientY-r.top};
  }
  function start(e){drawing=true; last=pos(e); e.preventDefault();}
  function move(e){
    if(!drawing) return;
    const p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last=p; sigState[id]=true; e.preventDefault();
  }
  function end(){drawing=false;}
  c.addEventListener('mousedown',start); c.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
  c.addEventListener('touchstart',start,{passive:false}); c.addEventListener('touchmove',move,{passive:false}); c.addEventListener('touchend',end);
}
function clearSig(id){
  const c=document.getElementById(id); const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height); sigState[id]=false;
}

// ---- Parts ----
function addPart(){
  const n=document.getElementById('partName').value.trim();
  const q=document.getElementById('partQty').value.trim()||'1';
  if(!n) return;
  parts.push({name:n, qty:q});
  document.getElementById('partName').value=''; document.getElementById('partQty').value='';
  renderParts();
}
function removePart(i){ parts.splice(i,1); renderParts(); }
function renderParts(){
  const tbody=document.querySelector('#partsTable tbody');
  tbody.innerHTML = parts.map((p,i)=>
    '<tr><td>'+esc(p.name)+'</td><td>'+esc(p.qty)+'</td><td><button type="button" class="btn small danger" onclick="removePart('+i+')">x</button></td></tr>'
  ).join('');
}
function esc(s){return (s||'').toString().replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

// ---- Form ----
function collect(){
  return {
    clientName: val('clientName'), clientDoc: val('clientDoc'),
    clientAddress: val('clientAddress'), clientContact: val('clientContact'),
    eqBrand: val('eqBrand'), eqModel: val('eqModel'), eqCapacity: val('eqCapacity'),
    eqDivision: val('eqDivision'), eqInmetro: val('eqInmetro'), eqSeal: val('eqSeal'),
    eqYear: val('eqYear'), eqSerial: val('eqSerial'),
    services: val('services'), parts: parts.slice(), obs: val('obs'),
    techName: val('techName'), svcDate: val('svcDate'),
    sigTech: document.getElementById('sigTech').toDataURL('image/png'),
    sigClient: document.getElementById('sigClient').toDataURL('image/png'),
    createdAt: new Date().toISOString()
  };
}
function val(id){return document.getElementById(id).value.trim();}

function resetForm(){
  document.getElementById('form').reset();
  document.getElementById('svcDate').value=new Date().toISOString().slice(0,10);
  parts=[]; renderParts();
  clearSig('sigTech'); clearSig('sigClient');
}

document.getElementById('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!sigState.sigTech || !sigState.sigClient){
    msg('Faltam assinaturas: técnico e cliente precisam assinar.', false); return;
  }
  const data=collect();
  try{
    if(db){
      await db.collection('reports').add(data);
    }
    await makePDF(data);
    msg('Relatório salvo e PDF gerado com sucesso!', true);
    resetForm();
  }catch(err){
    msg('Não foi possível concluir: '+(err && err.message ? err.message : err), false);
  }
});

// ---- PDF ----
async function makePDF(d){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm', format:'a4'});
  let y=16;
  doc.setFontSize(14); doc.text('Relatório Técnico de Campo — Balança', 14, y); y+=8;
  doc.setFontSize(9); doc.setTextColor(120); doc.text('Data: '+d.svcDate+'   Técnico: '+d.techName, 14, y); y+=8;
  doc.setTextColor(0);

  function section(title, pairs){
    doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(title, 14, y); y+=5;
    doc.setFont(undefined,'normal'); doc.setFontSize(9.5);
    pairs.forEach(([k,v])=>{
      if(!v) return;
      const lines=doc.splitTextToSize(k+': '+v, 182);
      doc.text(lines, 14, y); y+=lines.length*4.6;
    });
    y+=3;
  }
  section('Dados do Cliente', [['Nome/Razão Social', d.clientName],['CPF/CNPJ', d.clientDoc],['Endereço', d.clientAddress],['Contato', d.clientContact]]);
  section('Equipamento (Balança)', [['Marca', d.eqBrand],['Modelo', d.eqModel],['Capacidade', d.eqCapacity],['Divisão', d.eqDivision],['Portaria INMETRO', d.eqInmetro],['Selo de Reparado', d.eqSeal],['Ano de Fabricação', d.eqYear],['Número de Série', d.eqSerial]]);
  section('Serviços Realizados', [['Descrição', d.services]]);
  if(d.parts && d.parts.length){
    doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text('Peças Utilizadas', 14, y); y+=5;
    doc.setFont(undefined,'normal'); doc.setFontSize(9.5);
    d.parts.forEach(p=>{ doc.text('- '+p.name+'  (qtd: '+p.qty+')', 16, y); y+=4.6; });
    y+=3;
  }
  section('Observações', [['Obs', d.obs]]);

  if(y>230){ doc.addPage(); y=16; }
  y+=4;
  doc.setFontSize(10);
  try{ doc.addImage(d.sigTech, 'PNG', 14, y, 80, 28); }catch(e){}
  try{ doc.addImage(d.sigClient, 'PNG', 110, y, 80, 28); }catch(e){}
  y+=30;
  doc.text('Assinatura do Técnico', 14, y);
  doc.text('Assinatura do Cliente', 110, y);

  const blob=doc.output('blob');
  const fname='relatorio_'+(d.eqSerial||'balanca')+'_'+d.svcDate+'.pdf';
  if(downloads){
    await downloads.save({filename:fname, data:blob});
  } else {
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=fname; a.click();
  }
}

// ---- History ----
async function loadHistory(){
  const box=document.getElementById('histList');
  if(!db){ box.innerHTML='<p style="color:var(--muted)">Histórico indisponível nesta visualização.</p>'; return; }
  try{
    const snap=await db.collection('reports').orderBy('createdAt','desc').limit(50).get();
    if(snap.empty){ box.innerHTML='<p style="color:var(--muted)">Nenhum relatório salvo ainda.</p>'; return; }
    box.innerHTML='';
    snap.docs.forEach(doc=>{
      const d=doc.data();
      const el=document.createElement('div'); el.className='hist-item';
      el.innerHTML =
        '<h4>'+esc(d.clientName||'Cliente não informado')+'</h4>'+
        '<p>Balança: '+esc(d.eqBrand||'')+' '+esc(d.eqModel||'')+' — Série: '+esc(d.eqSerial||'')+'</p>'+
        '<p>Data: '+esc(d.svcDate||'')+' • Técnico: '+esc(d.techName||'')+'</p>'+
        '<div class="hist-actions">'+
          '<button class="btn small" data-act="pdf">Baixar PDF</button>'+
          '<button class="btn small danger" data-act="del">Excluir</button>'+
        '</div>';
      el.querySelector('[data-act="pdf"]').onclick=()=>makePDF(d);
      el.querySelector('[data-act="del"]').onclick=async()=>{
        if(confirm('Excluir este relatório do histórico?')){ await db.collection('reports').doc(doc.id).delete(); loadHistory(); }
      };
      box.appendChild(el);
    });
  }catch(err){
    box.innerHTML='<p style="color:var(--danger)">Erro ao carregar histórico: '+esc(err.message||String(err))+'</p>';
  }
}
</script>
</body>
</html>
